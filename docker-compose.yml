version: '3.8'
services:
  whatsapp-bot:
    build: .
    ports:
      - "${LOCAL_PORT}:${LOCAL_PORT}"
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=your-service-role-key
    restart: unless-stopped

networks:
  app-network:
    driver: bridge